version: '3.8'

services:
  # PostgreSQL数据库
  postgres:
    image: postgres:15-alpine
    container_name: xuanpin_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: xuanpin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - xuanpin_network

  # Redis缓存
  redis:
    image: redis:7-alpine
    container_name: xuanpin_redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - xuanpin_network

  # MongoDB (用于存储非结构化数据)
  mongodb:
    image: mongo:7
    container_name: xuanpin_mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: password
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - xuanpin_network

  # 后端API (开发环境)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: xuanpin_backend
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend_uploads:/app/uploads
      - backend_logs:/app/logs
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:password@postgres:5432/xuanpin
      - REDIS_URL=redis://redis:6379/0
      - MONGODB_URL=mongodb://root:password@mongodb:27017
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      - xuanpin_network

  # Celery Worker (后台任务)
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: xuanpin_celery_worker
    command: celery -A app.tasks.celery_app worker --loglevel=info
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:password@postgres:5432/xuanpin
      - REDIS_URL=redis://redis:6379/0
      - MONGODB_URL=mongodb://root:password@mongodb:27017
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    env_file:
      - ./backend/.env
    depends_on:
      - postgres
      - redis
      - backend
    networks:
      - xuanpin_network

  # Celery Beat (定时任务调度器)
  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: xuanpin_celery_beat
    command: celery -A app.tasks.celery_app beat --loglevel=info
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:password@postgres:5432/xuanpin
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    env_file:
      - ./backend/.env
    depends_on:
      - postgres
      - redis
      - backend
    networks:
      - xuanpin_network

  # 前端 (开发环境)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: xuanpin_frontend
    command: npm run dev
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - xuanpin_network

volumes:
  postgres_data:
  redis_data:
  mongodb_data:
  backend_uploads:
  backend_logs:

networks:
  xuanpin_network:
    driver: bridge
